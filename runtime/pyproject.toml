# GENERATED by scripts/gen_olav_skills.py — do not edit.
#
# The library code olav-skills runs on, vendored so the pack depends on no
# OLAV distribution: 45 modules, copied byte-identically from the olav
# repo under their original import names. Regenerate to update; a drift gate in
# that repo compares this tree against source.
#
# Deliberately NOT vendored — every module that needs an agent runtime or a
# memory layer at import time:
#   olav.core.llm — needs langchain, langchain_core
#   olav.core.memory — needs lancedb, pyarrow
#
# Their callers are already inside try/except paths that degrade, because a pack
# has no LLM endpoint and no recall store; the code behind them cannot run here.
#
# Vendored, but their optional backend is NOT installed — a lazily-imported
# package raises ImportError when that one code path is called, and nowhere else:
#   langchain_text_splitters — wanted by olav.core.utils
#   openai — wanted by olav.core.embedder
#   sentence_transformers — wanted by olav.core.embedder
#
# NOTE: this distribution provides the import names `olav`, `olav_netops`.
# Do not install it into an environment that also has the platform packages —
# use a virtualenv for the pack.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olav-skills-runtime"
version = "0.28.0"
description = "Vendored OLAV library code for the olav-skills pack — generated"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "textfsm>=2.1.0",
    "ntc-templates>=9.1.0",
    "networkx>=3.6.1",
    "netutils>=1.17.1",
    "netconan>=0.13",
]

# `packages` sweeps everything under these directories, data included — which is
# what the YAML under `olav_netops/data` needs: without it the topology ETL loads
# no protocols and silently produces zero links from a bundle full of CDP. A
# `force-include` for the same tree is not needed and makes hatchling refuse the
# build ("a second file is being added to the wheel archive at the same path").
[tool.hatch.build.targets.wheel]
packages = ["olav", "olav_netops"]
