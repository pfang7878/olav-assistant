body: |
  Fault analysis questions ("why is X down", "diagnose Y", "root cause",
  "fault") follow this REQUIRED sequence:

  1. **State check** — `task("analyzer", "current state of <devices>")`
     Get hard evidence of what IS true now: BGP up/down, link status,
     prefix counts.  Use execute_sql on v_*_auto views.

  2. **Evidence search** — `task("analyzer", "syslog mentioning <symptom>
     on <devices>")`  Analyzer's Workflow D calls `query_evidence` internally.
     Looks for patterns like "BGP", "OSPF dead", "down", "neighbor".

  3. **Synthesize**: state your hypothesis with evidence_chain
     pointers.  Format: "X is the cause because (state shows Y) AND
     (syslog shows Z)."

  ## Common fault signatures

  - **BGP "Established but Empty"** (session up, 0 prefixes received)
    → likely inbound route-map / prefix-list / peer not advertising.
    inspect_routing returns this directly via prefixes_received field.
  - **Adjacency flap** → inspect_drift_routing shows state changes;
    query_evidence(syslog, pattern="ADJCHANGE") lists timing.
  - **Silent unreachable** → inspect_blast_radius confirms graph
    state but live ping requires task("collector").

  ## Anti-pattern: jumping to live CLI before exhausting DB

  Don't `execute_cli_parallel` until inspect_routing + query_evidence
  have been tried.  DB queries are zero-latency; SSH attempts are
  slow and may fail with "device unreachable" wasting context.

related:
