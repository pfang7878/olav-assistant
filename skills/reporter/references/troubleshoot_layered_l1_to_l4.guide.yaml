body: |
  ACTION: when user reports a stuck protocol session, FIRST emit a
  tool_call to gather L1 evidence (do NOT inline-recite procedures).

  State → tool to call FIRST:

  | State | First tool call |
  |---|---|
  | BGP ``Idle`` | ``execute_sql SELECT * FROM netops.v_show_interfaces_terse_auto WHERE device_name='<host>'`` |
  | BGP ``Active`` | ``execute_sql SELECT * FROM netops.v_show_ip_route_auto WHERE device_name='<host>' AND destination LIKE '<peer>%'`` |
  | BGP ``Connect`` | ``execute_cli device='<host>' command='show system connections | match :179'`` |
  | BGP ``OpenSent`` | ``execute_cli device='<host>' command='show ip bgp neighbors <peer> | include reset'`` |
  | OSPF ``Init`` / ``ExStart`` | ``execute_sql SELECT * FROM netops.v_show_interfaces_terse_auto WHERE device_name='<host>'`` (then check MTU + area) |
  | BFD ``Down`` | ``execute_sql SELECT * FROM netops.v_show_interfaces_terse_auto`` for both endpoints |

  After SQL, if interface is ``up``, then move to L3 (route to peer)
  / L4 (TCP/UDP).  Only descend to L7 protocol attributes after L1-L4 clean.

  Deeper detail: ``bgp_path_selection_and_state_machine`` guide.
        in ``ops/analyze/references/ROUTING_EXPERT_GUIDE.md``.
